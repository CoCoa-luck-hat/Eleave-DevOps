services:

  db:
    image: mysql:latest
    container_name: db_eleave
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: ELeave
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
      TZ: Asia/Bangkok
    ports:
      - "3340:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./ELeave.sql:/docker-entrypoint-initdb.d/ELeave.sql
    networks:
      - mysql_phpmyadmin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin_eleave
    restart: always
    depends_on:
      - db
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "8040:80"
    networks:
      - mysql_phpmyadmin

networks:
  mysql_phpmyadmin:
    driver: bridge

volumes:
  mysql_dev_data:
